<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Myšlienková mapa informačnej architektúry</title>
  <desc id="desc">Myslenková mapa webu finančného poradcu s hlavnými témami: domov, služby, poradenstvo, kontakt, hypotéky, poistenie a investície.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#9db3c8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="720" rx="28" fill="#ffffff" stroke="#dfe7f1" stroke-width="2"/>
  <rect x="80" y="90" width="1040" height="86" rx="20" fill="#0a9be8"/>
  <text x="110" y="145" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">Informačná architektúra</text>

  <g filter="url(#shadow)">
    <g fill="#edf6ff" stroke="#b8c7d9" stroke-width="2">
      <rect x="120" y="260" width="180" height="100" rx="18"/>
      <rect x="360" y="260" width="180" height="100" rx="18"/>
      <rect x="600" y="260" width="180" height="100" rx="18"/>
      <rect x="840" y="260" width="180" height="100" rx="18"/>
      <rect x="210" y="500" width="180" height="100" rx="18"/>
      <rect x="510" y="500" width="180" height="100" rx="18"/>
      <rect x="810" y="500" width="180" height="100" rx="18"/>
    </g>
  </g>

  <g stroke="#0a9be8" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="210" y1="360" x2="360" y2="360"/>
    <line x1="450" y1="360" x2="600" y2="360"/>
    <line x1="690" y1="360" x2="840" y2="360"/>
    <line x1="210" y1="360" x2="300" y2="500"/>
    <line x1="450" y1="360" x2="600" y2="500"/>
    <line x1="690" y1="360" x2="900" y2="500"/>
    <line x1="930" y1="360" x2="900" y2="500"/>
  </g>

  <g fill="#0f1b2d" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">
    <text x="210" y="320" text-anchor="middle">A</text>
    <text x="450" y="320" text-anchor="middle">B</text>
    <text x="690" y="320" text-anchor="middle">C</text>
    <text x="930" y="320" text-anchor="middle">D</text>
    <text x="300" y="560" text-anchor="middle">E</text>
    <text x="600" y="560" text-anchor="middle">F</text>
    <text x="900" y="560" text-anchor="middle">G</text>
  </g>

  <g fill="#0f1b2d" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">
    <text x="210" y="670" text-anchor="middle">Domov</text>
    <text x="450" y="670" text-anchor="middle">Služby</text>
    <text x="690" y="670" text-anchor="middle">Poradenstvo</text>
    <text x="930" y="670" text-anchor="middle">Kontakt</text>
    <text x="300" y="670" text-anchor="middle">Hypotéky</text>
    <text x="600" y="670" text-anchor="middle">Poistenie</text>
    <text x="900" y="670" text-anchor="middle">Investície</text>
  </g>
</svg>
